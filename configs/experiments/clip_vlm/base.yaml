extends:
  - ../../protocols/clip_vlm_single_target.yaml
  - ../../methods/source_ft.yaml
  - ../../methods/tent.yaml
  - ../../methods/eata.yaml
  - ../../methods/sar.yaml
  - ../../methods/cotta.yaml
  - ../../methods/lame.yaml
  - ../../methods/t2a.yaml
  - ../../methods/frozen_clip.yaml
  - ../../methods/tda.yaml
  - ../../methods/dynaprompt.yaml
  - ../../methods/cliptta.yaml
  - ../../methods/batclip.yaml
  - ../../methods/iapl.yaml

device: auto
methods:
  - source_ft
  - tent
  - eata
  - sar
  - cotta
  - lame
  - t2a
  - frozen_clip
  - tda
  - dynaprompt
  - cliptta
  - batclip
  - iapl

model:
  family: clip_vlm_main
  source_detector:
    architecture: ViT-L/14
    checkpoint: ${CLIP_VIT_L14_CHECKPOINT}
    source_checkpoint: ${CLIP_VITL14_SOURCE_CHECKPOINT}
    image_size: 224
    resize_size: 256
    trainable_scope: full
  clip_native:
    architecture: ViT-L/14
    checkpoint: ${CLIP_VIT_L14_CHECKPOINT}
    image_size: 224
    resize_size: 256

data:
  image_size: 224
  batch_size: 16
  num_workers: 4
  shuffle: false
  max_samples_per_class: null

method_configs:
  source_ft:
    capture_initial_state: false
  tent:
    capture_initial_state: false
    clip_visual_layernorm: true
    data:
      batch_size: 16
      num_workers: 4
  eata:
    capture_initial_state: false
    clip_visual_layernorm: true
    data:
      batch_size: 16
      num_workers: 4
  sar:
    capture_initial_state: false
    data:
      batch_size: 16
      num_workers: 4
  cotta:
    capture_initial_state: false
    data:
      batch_size: 16
      num_workers: 4
  lame:
    capture_initial_state: false
    data:
      batch_size: 16
      num_workers: 4
  t2a:
    capture_initial_state: false
    clip_visual_layernorm: true
    data:
      batch_size: 16
      num_workers: 4
  frozen_clip:
    capture_initial_state: false
    data:
      batch_size: 16
      num_workers: 4
  tda:
    capture_initial_state: false
    data:
      batch_size: 16
      num_workers: 4
  dynaprompt:
    capture_initial_state: false
    data:
      batch_size: 1
      num_workers: 8
  cliptta:
    capture_initial_state: false
    data:
      batch_size: 16
      num_workers: 4
  batclip:
    capture_initial_state: false
    data:
      batch_size: 16
      num_workers: 4
  iapl:
    checkpoint: ${IAPL_GENIMAGE_CHECKPOINT}
    adaptation_mode: full
    normalization_mean: [0.481, 0.458, 0.408]
    normalization_std: [0.269, 0.261, 0.276]
    smooth: true
    data:
      batch_size: 1
      num_workers: 8

reporting:
  primary_table: clip_vitl14_method_native_online
  source_setup_column: required
  excluded_from_main_quantitative_table: [rotta, ttc, ours]
