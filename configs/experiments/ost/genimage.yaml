extends:
  - ../../datasets/genimage.yaml
  - ../../protocols/ost_single_target.yaml
  - ../../methods/ost.yaml

seed: 0
device: auto
methods: [ost]
output_dir: ${CTTA4AID_EXPERIMENT_ROOT}/ost_full_seed0

data:
  source_root: ${GENIMAGE_SD14_TEMPLATE_ARROW_ROOT}
  source_domain: stable_diffusion_v_1_4
  source_split: train
  # Fixed offline subset of the labeled SD v1.4 source training split.
  source_max_samples_per_class: 1000
  batch_size: 1
  num_workers: 0
  shuffle: false
  max_samples_per_class: null
  targets:
    - ADM
    - BigGAN
    - glide
    - Midjourney
    - stable_diffusion_v_1_5
    - VQDM
    - wukong

method_configs:
  ost:
    adaptation_mode: full
