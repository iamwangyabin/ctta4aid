seed: 0
device: auto
output_dir: outputs/source_train/universalfake_progan_resnet50

model:
  architecture: resnet50
  pretrained: true
  num_classes: 2

data:
  format: universalfake
  # Each root must contain a progan/ child. Keep the two roots disjoint.
  train_root: ${UFD_TRAIN_ROOT}
  val_root: ${UFD_SOURCE_VAL_ROOT}
  root: ${UFD_TRAIN_ROOT}
  generator: progan
  train_split: train
  val_split: val
  image_size: 224
  batch_size: 32
  num_workers: 4

training:
  # The original UniversalFakeDetect detector is CLIP-based. This is the
  # project's common CNN source recipe for a fair BN-TTA track.
  profile: common_cnn_source_project_recipe_not_ufd_official_detector
  epochs: 10
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  compute_fisher: true
  fisher_samples: 2000
  fisher_batch_size: 64
  fisher_source: disjoint_clean_source_validation_pseudo_labels
