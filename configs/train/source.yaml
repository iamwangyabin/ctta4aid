# Train the shared CNN source detector from the canonical project Arrow bundle.
seed: 0
device: auto
output_dir: outputs/source_train/universalfake_progan_resnet50_arrow

model:
  architecture: resnet50
  pretrained: true
  num_classes: 2

data:
  format: arrow
  train_root: ${UFD_FORENSYNTHS_ARROW_ROOT}
  val_root: ${UFD_FORENSYNTHS_ARROW_ROOT}
  root: ${UFD_FORENSYNTHS_ARROW_ROOT}
  generator: progan
  train_split: train
  val_split: val
  image_size: 224
  batch_size: 32
  num_workers: 4

training:
  profile: common_cnn_source_project_recipe_not_ufd_official_detector
  checkpoint_role: shared_source_detector_including_t2a
  intended_methods: [source, tent, eata, cotta, rotta, lame, t2a]
  epochs: 10
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  compute_fisher: true
  fisher_samples: 2000
  fisher_batch_size: 64
  fisher_source: disjoint_clean_source_validation_pseudo_labels
