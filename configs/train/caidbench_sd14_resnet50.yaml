seed: 0
device: auto
output_dir: outputs/source_train/caidbench_sd14_resnet50

model:
  architecture: resnet50
  pretrained: true
  pretrained_weights: imagenet1k_v1
  num_classes: 2

data:
  format: caidbench_arrow
  root: ${CAIDBENCH_ROOT}
  generator: SD1.4
  train_split: train
  val_split: test
  image_size: 224
  batch_size: 64
  num_workers: 8

training:
  profile: common_cnn_source_project_recipe_on_caidbench_sd14
  epochs: 10
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  compute_fisher: true
  fisher_samples: 2000
  fisher_batch_size: 64
  fisher_source: caidbench_sd14_test_pseudo_labels
