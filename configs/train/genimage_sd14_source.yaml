# Train the shared GenImage CNN source detector on the SD v1.4 Arrow bundle.
seed: 0
device: auto
output_dir: outputs/source_train/genimage_sd14_resnet50_arrow

model:
  architecture: resnet50
  pretrained: true
  num_classes: 2

data:
  format: arrow
  train_root: ${GENIMAGE_SD14_TRAIN_ARROW_ROOT}
  val_root: ${GENIMAGE_ARROW_ROOT}
  generator: stable_diffusion_v_1_4
  train_generator: stable_diffusion_v_1_4
  val_generator: stable_diffusion_v_1_4
  train_split: train
  # The canonical evaluation bundle stores the official held-out split as test.
  val_split: test
  image_size: 224
  batch_size: 32
  num_workers: 4

training:
  profile: common_cnn_source_project_recipe_not_genimage_official_detector
  checkpoint_role: shared_source_detector_including_t2a
  intended_methods: [source, tent, eata, cotta, rotta, lame, t2a]
  epochs: 10
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  compute_fisher: true
  fisher_samples: 2000
  fisher_batch_size: 64
  fisher_source: clean_source_holdout_pseudo_labels
