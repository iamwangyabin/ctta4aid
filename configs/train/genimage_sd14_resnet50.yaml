seed: 0
device: auto
output_dir: outputs/source_train/genimage_sd14_resnet50

model:
  architecture: resnet50
  pretrained: true
  num_classes: 2

data:
  format: genimage
  root: ${GENIMAGE_ROOT}
  generator: Stable Diffusion V1.4
  train_split: train
  val_split: val
  image_size: 224
  batch_size: 32
  num_workers: 4

training:
  # Common project checkpoint, not a numerical reproduction of GenImage's
  # 200-epoch timm/augmentation recipe.
  profile: common_cnn_source_project_recipe
  epochs: 10
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  compute_fisher: true
  fisher_samples: 2000
  fisher_batch_size: 64
  fisher_source: clean_source_validation_pseudo_labels
