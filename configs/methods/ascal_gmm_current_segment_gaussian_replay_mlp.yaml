extends: ascal_gmm_segmented_memory_posterior_no_historical_recall_gaussian_replay_mlp.yaml

methods:
  - ascal_gmm_current_segment_gaussian_replay_mlp_static
  - ascal_gmm_current_segment_gaussian_replay_mlp

method_configs:
  ascal_gmm_current_segment_gaussian_replay_mlp_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_current_segment_core
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_current_segment_gaussian_replay_mlp:
    adaptation_mode: full
    feature_replay_hidden_dim: 64
    feature_replay_learning_rate: 0.001
    feature_replay_variance_floor: 0.000001
    feature_replay_samples_per_update: 256
    feature_replay_seed: 0
    reference:
      profile: ascal_jmp_current_segment_core_r35
      research_name: ASCAL-JMP-CurrentSegmentCore
      research_version: R35
      ablation_parent: ASCAL-JMP-NoHistoricalRecall-R34
      ablation_variable: unused_shadow_archive_deleted
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: true
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      routing_coordinate: none_current_segment_state_only
      routing_candidates: current_active_gmm_only
      routing_score_used: false
      historical_expert_recall: false
      episodic_memory_updated: false
      episodic_memory_role: none
      state_scope: one_current_segment_gmm_feature_distribution_and_mlp
      gmm_role: current_segment_equal_prior_pseudo_label_and_continuous_reliability_only
      gmm_in_final_prediction: false
      feature_memory: current_segment_real_and_fake_weighted_diagonal_gaussian_sufficient_statistics
      raw_images_stored: false
      raw_features_stored: false
      replay_balance: equal_real_and_fake
      replay_samples_per_update: 256
      generated_feature_reuse: false
      replay_minibatch: current_stream_batch_size
      replay_passes: 1
      residual_head: one_zero_initialized_768_to_64_to_1_gelu_mlp_for_current_segment
      prediction_rule: frozen_base_logit_plus_current_segment_residual_logit
      optimizer: one_adam_state_for_current_segment
      learning_rate: 0.001
      confidence_threshold: none
      memory_capacity: none
      fusion_weight: none
      prediction_mutates_experts: false
      target_selected_hyperparameters: 0
      seed1_acceptance_rule: exact_online_equivalence_to_r34_then_r26_noninferiority
