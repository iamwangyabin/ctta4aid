extends: ascal_gmm_segmented_memory_posterior_rms_ridge_expert.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_feature_routed_trusted_ridge_static
  - ascal_gmm_segmented_memory_posterior_feature_routed_trusted_ridge

method_configs:
  ascal_gmm_segmented_memory_posterior_feature_routed_trusted_ridge_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_feature_routed_trusted_ridge
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_feature_routed_trusted_ridge:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_feature_routed_trusted_ridge_r22
      research_name: ASCAL-JMP-FeatureRoutedTrustedRidge
      research_version: R22
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: true
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      routing_coordinate: l2_normalized_frozen_clip_feature_orthogonal_to_source_binary_head
      routing_rule: maximum_mean_cosine_similarity_to_historical_expert_prototype
      routing_score_used: false
      routing_granularity: one_current_unlabeled_stream_batch
      gmm_role: selected_old_expert_equal_prior_pseudo_label_and_continuous_reliability_only
      gmm_in_final_prediction: false
      pseudo_label: selected_gmm_equal_prior_posterior_argmax
      reliability: absolute_selected_gmm_signed_posterior_without_threshold
      ridge_target: real_or_fake_one_hot_vector
      ridge_input: l2_normalized_frozen_clip_feature_plus_constant_bias
      ridge_update: exact_recursive_least_squares_woodbury_after_prediction
      prediction_rule: equal_average_of_frozen_base_and_selected_direct_ridge_probabilities
      cold_start_rule: zero_ridge_probability_one_half_preserves_source_accuracy_and_auc
      gmm_update_score_coordinate: immutable_source_score
      optimizer: none
      learning_rate: none
      epochs: none
      prediction_mutates_experts: false
      raw_images_stored: false
      raw_features_stored: false
      new_target_hyperparameters: 0
      seed1_promotion_rule: target_macro_accuracy_above_r21_and_target_macro_auc_above_source
