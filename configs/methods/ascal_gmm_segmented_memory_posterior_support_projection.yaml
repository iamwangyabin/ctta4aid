extends: ascal_gmm_segmented_memory_posterior_projection.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_support_projection_static
  - ascal_gmm_segmented_memory_posterior_support_projection

method_configs:
  ascal_gmm_segmented_memory_posterior_support_projection_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_support_projection
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_support_projection:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_support_median_r04
      research_name: ASCAL-JMP-SupportMedian
      research_version: R04
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      adaptive_scope: unlabeled_sample_support_weighted_boundary_median
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_temperature
      partition_rule: largest_adjacent_component_mean_gap
      class_density_rule: independently_normalized_real_and_fake_gmm_blocks
      class_prior_rule: equal_real_and_fake_priors
      boundary_rule: equal_prior_class_density_crossing_inside_the_dominant_gap
      boundary_vote_rule: weighted_median_by_causal_segment_sample_support
      exact_tie_rule: midpoint_of_adjacent_boundary_values
      segmentation_rule: existing_binary_scheduled_segmented_bic
      recall_rule: fixed_episode_deviance_plus_identity_code_vs_new_segment_bic
      recalled_boundary_rule: existing_one_episode_vote_with_fit_count_decay
      ranking_rule: source_margin_order_preserved_within_each_causal_state
      new_target_hyperparameters: 0
      raw_images_stored: false
      source_fallback: exact_when_bic_selects_one_component
