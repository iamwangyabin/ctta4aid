extends: ascal_gmm_segmented_memory_posterior_feature_routed_trusted_ridge.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_feature_routed_source_ridge_static
  - ascal_gmm_segmented_memory_posterior_feature_routed_source_ridge

method_defaults:
  source_checkpoint: ${ASCAL_ANALYTIC_RIDGE_SOURCE_CHECKPOINT}
  classifier_feature_normalization: l2

method_configs:
  ascal_gmm_segmented_memory_posterior_feature_routed_source_ridge_static:
    adaptation_mode: static
    reference:
      role: exact_non_adaptive_source_ridge_control
      source_setup: lora_r4_features_with_complete_labeled_source_ridge_statistics
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_feature_routed_source_ridge:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_source_ridge_inheritance_r23
      research_name: ASCAL-JMP-SourceRidgeInheritance
      research_version: R23
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: true
      frozen_scope: clip_backbone_lora_branches_source_ridge_and_source_score
      source_classifier: labeled_source_two_output_analytic_ridge
      source_feature_coordinate: l2_normalized_clip_lora_feature_plus_constant_bias
      source_sufficient_statistics: regularized_gram_inverse_cross_covariance_weights_class_mass_and_support
      expert_initialization: exact_deep_copy_of_complete_source_ridge_statistics
      routing_coordinate: l2_normalized_frozen_clip_feature_orthogonal_to_source_ridge_direction
      routing_rule: maximum_mean_cosine_similarity_to_historical_expert_prototype
      routing_score_used: false
      gmm_role: selected_old_expert_equal_prior_pseudo_label_and_continuous_reliability_only
      pseudo_label: selected_gmm_equal_prior_posterior_argmax
      reliability: absolute_selected_gmm_signed_posterior_without_threshold
      expert_update: add_reliability_weighted_target_pseudo_samples_to_inherited_source_statistics
      prediction_rule: selected_expert_ridge_softmax_probability_only
      base_probability_in_final_prediction: false
      cold_start_rule: exact_source_ridge_classifier
      gmm_update_score_coordinate: immutable_source_ridge_score
      optimizer: none
      learning_rate: none
      epochs: none
      prediction_mutates_experts: false
      raw_images_stored: false
      raw_features_stored: false
      new_target_hyperparameters: 0
      seed1_promotion_rule: target_macro_accuracy_above_source_ridge_and_target_macro_auc_above_source_ridge
