extends: ascal_gmm_segmented_shift.yaml

methods:
  - ascal_gmm_segmented_memory_shift_static
  - ascal_gmm_segmented_memory_shift

method_configs:
  ascal_gmm_segmented_memory_shift_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_segmented_memory_shift
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_shift:
    adaptation_mode: full
    reference:
      profile: ascal_asymmetric_online_gmm_segmented_memory_shift_v1
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      adaptive_scope: unlabeled_segmented_score_boundary_with_episodic_recall
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_temperature
      segment_memory: completed_gmm_boundary_sample_count_summaries
      recall_rule: fixed_episode_deviance_plus_identity_code_vs_new_segment_bic
      identity_code: two_log_number_of_eligible_episodes
      memory_update: latest_completed_visit_replaces_recalled_episode_summary
      recalled_boundary_rule: one_episode_anchor_vote_then_current_segment_evidence
      prediction_rule: monotone_shift_of_raw_detector_score
      raw_images_stored: false
      memory_capacity: number_of_distinct_bic_selected_score_regimes
      source_fallback: exact_when_bic_selects_one_component
