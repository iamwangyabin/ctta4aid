extends: ascal_gmm_segmented_memory_posterior_global_residual.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_real_deviation_residual_static
  - ascal_gmm_segmented_memory_posterior_real_deviation_residual

method_configs:
  ascal_gmm_segmented_memory_posterior_real_deviation_residual_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_real_deviation_residual
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_real_deviation_residual:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_real_deviation_r07
      research_name: ASCAL-JMP-RealDeviation
      research_version: R07
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      adaptive_scope: one_global_causal_centered_real_manifold_residual_over_r01
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      immutable_history_coordinate: frozen_source_logit_margin_only
      base_prediction_rule: exact_r01_median_stabilized_posterior_projection
      residual_count: 1
      residual_scope: one_shared_real_anchor_for_the_continual_stream
      residual_input: source_head_orthogonal_l2_normalized_frozen_features
      residual_teacher: equal_prior_current_source_score_gmm_real_posterior
      reliability_rule: absolute_centered_soft_posterior_without_threshold
      real_prototype_rule: one_soft_mean_for_the_complete_real_gmm_block
      fake_prototype_rule: none_fake_is_open_heterogeneity
      residual_update: cumulative_soft_real_feature_mean_without_optimizer
      residual_readout: half_centered_squared_distance_R_times_R_minus_cosine
      residual_expectation: zero_under_the_accumulated_soft_real_measure
      residual_range: closed_interval_minus_0p25_to_2
      prediction_rule: r01_base_logit_plus_one_real_deviation_residual
      adaptive_score_history_stored: false
      optimizer: none
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_noninferiority_0p2pp_auc_gain_0p1pp_and_above_r06
      raw_images_stored: false
      source_fallback: exact_before_any_reliable_two_block_real_evidence
