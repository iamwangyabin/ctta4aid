extends: ascal_gmm_segmented_memory_posterior_projection.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_mdl_route_static
  - ascal_gmm_segmented_memory_posterior_mdl_route

method_configs:
  ascal_gmm_segmented_memory_posterior_mdl_route_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_mdl_expert_routing
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_mdl_route:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_mdl_route_r10
      research_name: ASCAL-JMP-MDLRoute
      research_version: R10
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      adaptive_scope: one_consistent_mdl_expert_assignment_for_prediction_and_learning
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      expert_type: frozen_gmm_plus_projected_bayes_boundary
      expert_network_count: 0
      routing_coordinate: immutable_frozen_source_logit_margin
      routing_candidates: active_learning_state_plus_all_completed_memories
      routing_granularity: one_current_unlabeled_stream_batch
      routing_proposal: minimum_negative_two_sum_log_fixed_gmm_predictive_density
      routing_admission: proposed_memory_deviance_plus_uniform_identity_code_vs_current_batch_gmm_bic
      routing_threshold: none
      routing_identity_penalty: negative_two_log_uniform_prior_equals_two_log_eligible_memories
      current_batch_gmm_role: temporary_new_state_description_only_not_a_classifier_or_persistent_expert
      assignment_consistency: same_admitted_expert_predicts_and_receives_adaptation
      admitted_memory_update: start_new_active_visit_then_replace_memory_when_visit_completes
      rejected_memory_prediction: exact_active_r01_readout_or_source_fallback
      rejected_memory_update: none_r01_active_or_novel_state_learning_receives_the_batch
      routing_changes_learning_state_during_prediction: false
      prediction_mutates_experts: false
      batch_transductive_prediction: true
      immutable_history_coordinate: frozen_source_logit_margin_only
      optimizer: none
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_noninferiority_0p2pp_auc_gain_0p1pp_and_above_r06
      raw_images_stored: false
      source_fallback: exact_source_when_no_admitted_active_or_memory_expert_is_available
