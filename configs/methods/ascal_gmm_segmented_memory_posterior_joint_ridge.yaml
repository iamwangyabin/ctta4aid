extends: ascal_gmm_segmented_memory_posterior_ordinal_route.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_joint_ridge_static
  - ascal_gmm_segmented_memory_posterior_joint_ridge

method_configs:
  ascal_gmm_segmented_memory_posterior_joint_ridge_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_joint_ridge
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_joint_ridge:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_joint_ridge_r16
      research_name: ASCAL-JMP-JointRidge
      research_version: R16
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      protected_initialization: exact_r12_ordinal_route
      protected_routing: exact_r12_unique_live_mdl_assignment
      protected_adaptation: exact_r12_segmentation_memory_and_expert_assignment
      accuracy_invariance: none_joint_ridge_may_change_r12_hard_decisions
      expert_type: r12_gmm_boundary_plus_one_online_weighted_joint_ridge
      linear_head_per_expert: true
      residual_input: source_head_orthogonal_l2_normalized_frozen_features_plus_bias
      residual_teacher: prediction_time_selected_r12_gmm_equal_prior_log_odds
      residual_target: gmm_teacher_logit_minus_prediction_time_r12_base_logit
      residual_target_centering: none
      reliability_rule: absolute_centered_soft_posterior_without_threshold
      ridge_objective: weighted_uncentered_logit_residual_error_plus_unit_l2_weight_norm
      ridge_prior: fixed_identity_for_unit_feature_and_unit_bias_coordinates
      ridge_update: exact_recursive_least_squares_woodbury_after_prediction
      optimizer: none
      learning_rate: none
      epochs: none
      residual_intercept: one_constant_bias_coordinate_per_expert
      prediction_residual_centering: none
      prediction_rule: sigmoid_of_r12_base_logit_plus_expert_feature_residual_and_bias
      joint_odds_rule: r12_odds_times_exp_of_expert_ridge_evidence
      routing_score_coordinate: immutable_source_score
      gmm_update_score_coordinate: immutable_source_score
      routing_threshold: none
      prediction_mutates_experts: false
      raw_images_stored: false
      raw_features_stored: false
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_above_r12_and_target_macro_online_auc_above_r06
