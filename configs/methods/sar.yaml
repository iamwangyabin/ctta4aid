methods: [sar]

method_configs:
  sar:
    capture_initial_state: false
    data:
      batch_size: 16
      num_workers: 4
    optimizer: SGD
    steps: 1
    lr: 0.00025
    momentum: 0.9
    weight_decay: 0.0
    rho: 0.05
    adaptive: false
    # SAR's published 0.4*log(C) rule, scaled to binary real/fake detection.
    margin: 0.2772588722239781
    reset_constant: 0.2
    exclude_last_visual_blocks: 3
    exclude_visual_output_norm: true
    reference:
      profile: official_sar_vit_layernorm_path_on_clip_vitl14
      repository: https://github.com/mr-eggplant/SAR
      commit: 20f6e24b17525f34503510afccedc0629b67b7c4
      protocol: predict_then_adapt
      transfer_note: >
        The official SAR ViT LayerNorm path is applied to the shared CLIP
        visual tower. Its final-three-block exclusion is mapped from ViT-B to
        ViT-L/14.
