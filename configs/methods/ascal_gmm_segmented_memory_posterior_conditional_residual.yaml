extends: ascal_gmm_segmented_memory_posterior_global_residual.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_conditional_residual_static
  - ascal_gmm_segmented_memory_posterior_conditional_residual

method_configs:
  ascal_gmm_segmented_memory_posterior_conditional_residual_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_conditional_residual
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_conditional_residual:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_conditional_residual_r08
      research_name: ASCAL-JMP-ConditionalResidual
      research_version: R08
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      adaptive_scope: one_global_prototype_residual_with_source_conditioned_innovation
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      immutable_history_coordinate: frozen_source_logit_margin_only
      base_prediction_rule: exact_r01_median_stabilized_posterior_projection
      residual_count: 1
      raw_residual: r05_global_fake_minus_real_prototype_cosine
      conditional_moment_input: immutable_source_margin_and_preupdate_raw_residual
      conditional_moment_state: exact_stream_wide_second_moments_without_window
      innovation_rule: raw_residual_minus_online_projection_on_source_margin
      innovation_trust: positive_online_source_residual_correlation
      innovation_scale: positive_correlation_times_source_std_over_residual_std_and_temperature
      innovation_rms_bound: at_most_one_half_source_margin_std_over_temperature
      prediction_rule: r01_base_plus_raw_residual_plus_source_conditioned_innovation
      adaptive_score_history_stored: false
      adaptive_residual_history_stored: false
      optimizer: none
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_noninferiority_0p2pp_auc_gain_0p1pp_and_above_r06
      raw_images_stored: false
      source_fallback: exact_r05_until_causal_second_moments_are_available
