extends: ascal_gmm_segmented_memory_posterior_ordinal_route.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_equal_prior_ridge_expert_static
  - ascal_gmm_segmented_memory_posterior_equal_prior_ridge_expert

method_configs:
  ascal_gmm_segmented_memory_posterior_equal_prior_ridge_expert_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_equal_prior_ridge_expert
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_equal_prior_ridge_expert:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_equal_prior_ridge_r20
      research_name: ASCAL-JMP-EqualPriorRidge
      research_version: R20
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      protected_routing: exact_r12_unique_live_mdl_assignment
      protected_adaptation: exact_r12_segmentation_memory_and_expert_assignment
      protected_r19_learning: exact_r19_direct_one_hot_ridge_and_reliability_weighted_rls
      protected_initialization: exact_r12_until_both_pseudo_classes_and_centered_historical_rms_are_valid
      expert_scope: one_online_two_output_analytic_ridge_state_per_r12_gmm_expert
      expert_input: l2_normalized_frozen_clip_feature_plus_constant_bias
      pseudo_label: exact_r12_routed_hard_class_after_prediction
      reliability: absolute_selected_gmm_signed_posterior_without_threshold
      posterior_conflict_rule: opposite_r12_class_side_gets_zero_weight
      ridge_target: real_or_fake_one_hot_vector
      ridge_objective: exact_r19_reliability_weighted_two_output_one_hot_ridge
      ridge_update: exact_recursive_least_squares_woodbury_after_prediction
      equal_prior_statistics: historical_ridge_margin_centroid_per_pseudo_class
      equal_prior_center: midpoint_of_real_and_fake_margin_centroids
      centered_ridge_margin: raw_ridge_margin_minus_equal_prior_center
      scale_alignment: historical_rms_for_r12_and_equal_prior_centered_ridge_margins
      prediction_rule: sigmoid_of_unit_rms_r12_margin_plus_unit_rms_equal_prior_centered_ridge_margin
      class_prior_assumption: equal_real_fake_prior
      cold_start_rule: exact_r12_without_a_minimum_sample_threshold
      routing_score_coordinate: immutable_source_score
      gmm_update_score_coordinate: immutable_source_score
      routing_threshold: none
      optimizer: none
      learning_rate: none
      epochs: none
      prediction_mutates_experts: false
      raw_images_stored: false
      raw_features_stored: false
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_above_r12_and_target_macro_online_auc_above_r06
