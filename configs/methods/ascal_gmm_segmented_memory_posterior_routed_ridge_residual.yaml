extends: ascal_gmm_segmented_memory_posterior_routed_residual.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_routed_ridge_residual_static
  - ascal_gmm_segmented_memory_posterior_routed_ridge_residual

method_configs:
  ascal_gmm_segmented_memory_posterior_routed_ridge_residual_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_routed_ridge_residual
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_routed_ridge_residual:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_routed_ridge_r14
      research_name: ASCAL-JMP-RoutedRidge
      research_version: R14
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      immutable_history_coordinate: frozen_source_logit_margin_only
      base_prediction_rule: exact_r01_median_stabilized_posterior_projection
      score_boundary_routing: false
      residual_routing_rule: exact_unchanged_r13_unique_live_mdl_assignment
      routing_threshold: none
      residual_assignment_consistency: same_selected_expert_reads_and_receives_the_batch
      expert_type: zero_initialized_online_weighted_ridge_linear_head
      residual_input: source_head_orthogonal_l2_normalized_frozen_features
      residual_teacher: prediction_time_selected_source_score_gmm_posterior
      soft_target_rule: two_times_gmm_posterior_minus_one
      reliability_rule: absolute_centered_soft_posterior_without_threshold
      ridge_objective: weighted_squared_soft_target_error_plus_unit_l2_weight_norm
      ridge_prior: fixed_identity_under_unit_normalized_features
      ridge_update: exact_recursive_least_squares_woodbury_after_prediction
      optimizer: none
      learning_rate: none
      epochs: none
      residual_intercept: none_global_shift_is_handled_by_r01_base
      residual_readout_bound: none
      residual_readout: selected_expert_orthogonal_feature_dot_weight
      prediction_rule: r01_continuous_base_logit_plus_selected_expert_linear_residual
      routing_changes_score_calibrator: false
      prediction_mutates_experts: false
      batch_transductive_prediction: true
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_within_0p2pp_of_r12_and_auc_above_r06
      raw_images_stored: false
      raw_features_stored: false
