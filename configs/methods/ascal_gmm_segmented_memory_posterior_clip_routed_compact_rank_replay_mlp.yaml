extends: ascal_gmm_segmented_memory_posterior_clip_routed_decoupled_rank_replay_mlp.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_clip_routed_compact_rank_replay_mlp_static
  - ascal_gmm_segmented_memory_posterior_clip_routed_compact_rank_replay_mlp

method_configs:
  ascal_gmm_segmented_memory_posterior_clip_routed_compact_rank_replay_mlp_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_compact_rank
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_clip_routed_compact_rank_replay_mlp:
    adaptation_mode: full
    feature_replay_hidden_dim: 32
    feature_replay_learning_rate: 0.001
    feature_replay_variance_floor: 0.000001
    feature_replay_samples_per_update: 256
    feature_replay_seed: 0
    reference:
      profile: ascal_jmp_compact_rank_r41
      research_name: ASCAL-JMP-CompactRank
      research_version: R41
      ablation_parent: ASCAL-JMP-DecoupledRank-R39
      ablation_variable: hidden_dimension_64_to_32
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      routing_score_used: false
      historical_expert_recall: clip_feature_route_only
      gmm_role: selected_expert_pseudo_label_and_continuous_reliability_only
      gmm_in_final_prediction: false
      replay_rule: 128_real_and_128_fake_fresh_pseudo_features_per_update
      residual_head: one_zero_initialized_768_to_32_to_1_gelu_mlp_per_expert
      training_objective: decoupled_calibration_and_pairwise_ranking
      learning_rate: 0.001
      confidence_threshold: none
      fusion_weight: none
      target_selected_hyperparameters: 0
