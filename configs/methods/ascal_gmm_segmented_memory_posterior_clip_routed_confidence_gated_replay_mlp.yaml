extends: ascal_gmm_segmented_memory_posterior_clip_routed_gaussian_replay_mlp.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_clip_routed_confidence_gated_replay_mlp_static
  - ascal_gmm_segmented_memory_posterior_clip_routed_confidence_gated_replay_mlp

method_configs:
  ascal_gmm_segmented_memory_posterior_clip_routed_confidence_gated_replay_mlp_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_confidence_gated_replay
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_clip_routed_confidence_gated_replay_mlp:
    adaptation_mode: full
    feature_replay_hidden_dim: 64
    feature_replay_learning_rate: 0.001
    feature_replay_variance_floor: 0.000001
    feature_replay_samples_per_update: 256
    feature_replay_seed: 0
    reference:
      profile: ascal_jmp_gmm_confidence_gate_r42
      research_name: ASCAL-JMP-GMMConfidenceGate
      research_version: R42
      ablation_parent: ASCAL-JMP-CLIPExpertMemory-R37
      ablation_variable: continuous_gmm_confidence_gate_on_feature_residual
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      routing_score_used: false
      historical_expert_recall: clip_feature_route_only
      gmm_role: selected_expert_pseudo_supervision_and_continuous_inference_reliability
      gmm_in_final_prediction: true
      gmm_final_prediction_role: confidence_gate_only_not_score_fusion
      replay_rule: 128_real_and_128_fake_fresh_pseudo_features_per_update
      residual_head: one_zero_initialized_768_to_64_to_1_gelu_mlp_per_expert
      training_objective: unchanged_r37_balanced_replay_bce
      prediction_rule: source_logit_plus_expert_bias_plus_confidence_gated_feature_residual
      confidence_gate: absolute_two_posterior_minus_one
      confidence_gate_exponent: 1
      learning_rate: 0.001
      confidence_threshold: none
      fusion_weight: none
      target_selected_hyperparameters: 0
