extends: ascal_gmm_segmented_memory_posterior_mdl_route.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_live_route_static
  - ascal_gmm_segmented_memory_posterior_live_route

method_configs:
  ascal_gmm_segmented_memory_posterior_live_route_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_unique_live_expert_routing
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_live_route:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_live_route_r11
      research_name: ASCAL-JMP-LiveRoute
      research_version: R11
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      adaptive_scope: one_unique_live_state_per_mdl_routed_expert
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      expert_type: one_live_gmm_or_archived_fallback_plus_projected_bayes_boundary
      expert_network_count: 0
      routing_coordinate: immutable_frozen_source_logit_margin
      routing_candidates: active_live_state_plus_archived_non_active_experts
      active_snapshot_rule: hidden_when_the_same_expert_has_an_eligible_live_gmm
      inactive_snapshot_rule: retained_only_as_same_identity_fallback_when_live_gmm_is_ineligible
      routing_proposal: minimum_negative_two_sum_log_fixed_gmm_predictive_density
      routing_admission: non_active_memory_deviance_plus_uniform_identity_code_vs_current_batch_gmm_bic
      routing_threshold: none
      assignment_consistency: same_unique_live_expert_predicts_and_receives_adaptation
      routing_changes_learning_state_during_prediction: false
      prediction_mutates_experts: false
      batch_transductive_prediction: true
      immutable_history_coordinate: frozen_source_logit_margin_only
      optimizer: none
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_noninferiority_0p2pp_auc_gain_0p1pp_and_above_r06
      raw_images_stored: false
      source_fallback: exact_source_when_no_admitted_live_or_archived_expert_is_available
