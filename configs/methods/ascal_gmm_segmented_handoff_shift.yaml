extends: ascal_gmm_segmented_shift.yaml

methods:
  - ascal_gmm_segmented_handoff_shift_static
  - ascal_gmm_segmented_handoff_shift

method_configs:
  ascal_gmm_segmented_handoff_shift_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_segmented_handoff_shift
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_handoff_shift:
    adaptation_mode: full
    reference:
      profile: ascal_asymmetric_online_gmm_segmented_handoff_shift_v1
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      adaptive_scope: one_unlabeled_segmented_continuous_handoff_score_boundary
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_temperature
      partition_rule: largest_adjacent_component_mean_gap
      stabilization_rule: cumulative_median_within_the_current_segment
      segmentation_rule: binary_scheduled_bic_split_with_an_active_unsplit_suffix
      change_point_penalty: one_additional_bic_parameter
      segment_reset_scope: score_mixture_and_raw_boundary_history_only
      handoff_anchor: last_boundary_emitted_before_the_change
      handoff_rule: anchor_weight_1_over_j_and_segment_median_weight_j_minus_1_over_j
      uncertain_fit_behavior: hold_last_emitted_boundary_after_the_first_change
      prediction_rule: monotone_continuous_shift_of_raw_detector_score
      initial_source_fallback: exact_when_bic_selects_one_component
