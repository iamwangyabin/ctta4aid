methods: [ascal_static, ascal]

method_configs:
  ascal_static:
    capture_initial_state: false
    adaptation_mode: static
    architecture: ViT-L/14
    checkpoint: ${CLIP_VIT_L14_CHECKPOINT}
    source_checkpoint: ${ASCAL_LORA_SOURCE_CHECKPOINT}
    image_size: 224
    resize_size: 256
    lora_rank: 4
    lora_alpha: 8
    views: 5
    jpeg_qualities: [75, 85, 95]
    data:
      batch_size: 16
      num_workers: 0
    reference:
      role: exact_non_adaptive_control_for_ascal
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal:
    capture_initial_state: false
    adaptation_mode: full
    architecture: ViT-L/14
    checkpoint: ${CLIP_VIT_L14_CHECKPOINT}
    source_checkpoint: ${ASCAL_LORA_SOURCE_CHECKPOINT}
    image_size: 224
    resize_size: 256
    lora_rank: 4
    lora_alpha: 8
    views: 5
    jpeg_qualities: [75, 85, 95]
    memory_capacity: 2000
    window_size: 200
    admission_rate_floor: 0.5
    anchor_kappa: 100
    fuse_sigma_multiplier: 3.0
    min_sigma: 0.001
    lambda_initial: 1.0
    lambda_min: 0.5
    lambda_min_entries_per_class: 64
    lambda_stable_windows: 2
    lambda_anneal_windows: 4
    pi_prior_strength: 50
    gates:
      bimodality: true
      admission: true
      drift_fuse: true
    data:
      batch_size: 16
      num_workers: 0
    reference:
      profile: ascal_anchored_score_calibration_v1
      protocol: predict_then_adapt
      target_labels_used: false
      adaptive_scope: score_distribution_memory_only_no_parameter_gradients
      frozen_scope: clip_backbone_lora_branches_and_binary_head
      anchor_rule: map_prior_always_points_at_source_anchors
