methods: [ours_static, ours]

method_configs:
  ours_static:
    capture_initial_state: false
    adaptation_mode: static
    readout_mode: calibrated
    architecture: ViT-L/14
    checkpoint: ${CLIP_VIT_L14_CHECKPOINT}
    source_checkpoint: ${OURS_SOURCE_CHECKPOINT}
    image_size: 224
    resize_size: 256
    lora_rank: 4
    lora_alpha: 8
    data:
      batch_size: 16
      num_workers: 0
    reference:
      role: exact_non_adaptive_control_for_ours
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ours_no_calibrated_readout:
    capture_initial_state: false
    adaptation_mode: full
    readout_mode: base
    architecture: ViT-L/14
    checkpoint: ${CLIP_VIT_L14_CHECKPOINT}
    source_checkpoint: ${OURS_SOURCE_CHECKPOINT}
    image_size: 224
    resize_size: 256
    lora_rank: 4
    lora_alpha: 8
    data:
      batch_size: 16
      num_workers: 0
    feature_replay_hidden_dim: 64
    feature_replay_learning_rate: 0.001
    feature_replay_variance_floor: 0.000001
    feature_replay_samples_per_update: 256
    feature_replay_seed: 0
    reference:
      profile: ours_base_readout
      research_name: Ours
      internal_version: R37
      role: readout_ablation
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      prediction_rule: source_logit_plus_feature_residual
      intercept_refit: false

  ours:
    capture_initial_state: false
    adaptation_mode: full
    readout_mode: calibrated
    architecture: ViT-L/14
    checkpoint: ${CLIP_VIT_L14_CHECKPOINT}
    source_checkpoint: ${OURS_SOURCE_CHECKPOINT}
    image_size: 224
    resize_size: 256
    lora_rank: 4
    lora_alpha: 8
    data:
      batch_size: 16
      num_workers: 0
    feature_replay_hidden_dim: 64
    feature_replay_learning_rate: 0.001
    feature_replay_variance_floor: 0.000001
    feature_replay_samples_per_update: 256
    feature_replay_seed: 0
    feature_residual_scale: 0.75
    reference:
      profile: ours_calibrated_readout
      research_name: Ours
      internal_version: R47
      role: final_method
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      routing_score_used: false
      historical_expert_recall: clip_feature_route_only
      gmm_role: selected_expert_equal_prior_pseudo_label_and_continuous_reliability_only
      gmm_in_final_prediction: false
      replay_rule: 128_real_and_128_fake_fresh_pseudo_features_per_update
      residual_head: one_zero_initialized_768_to_64_to_1_gelu_mlp_per_expert
      residual_coordinate: l2_normalized_frozen_clip_feature
      training_objective: balanced_bce_on_source_plus_residual
      feature_residual_scale_selection: fixed_from_seed1_four_dataset_scale_sweep
      calibration_rule: balanced_replay_bce_stationary_intercept_with_frozen_head_weights
      calibration_optimizer: none_deterministic_monotone_bisection
      calibration_extra_replay: none_reuses_current_generated_replay
      prediction_rule: source_logit_plus_recalibrated_intercept_plus_0p75_feature_residual
      target_selected_hyperparameters: 1
      formal_status: final_method_fixed_pending_formal_seed_validation
