methods: [ascal_gmm_static, ascal_gmm]

method_defaults:
  capture_initial_state: false
  architecture: ViT-L/14
  checkpoint: ${CLIP_VIT_L14_CHECKPOINT}
  source_checkpoint: ${ASCAL_LORA_SOURCE_CHECKPOINT}
  image_size: 224
  resize_size: 256
  lora_rank: 4
  lora_alpha: 8
  data:
    batch_size: 16
    num_workers: 0

method_configs:
  ascal_gmm_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_ascal_gmm
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm:
    adaptation_mode: full
    reference:
      profile: ascal_asymmetric_online_gmm_v1
      protocol: predict_then_adapt
      target_labels_used: false
      adaptive_scope: unlabeled_score_mixture_only_no_parameter_gradients
      frozen_scope: clip_backbone_lora_branches_and_binary_head
      component_rule: lowest_mean_is_real_all_higher_means_are_fake
      selection_rule: bic_over_all_causally_arrived_scores
      source_fallback: exact_when_bic_selects_one_component
