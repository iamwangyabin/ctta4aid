extends: ascal_gmm_segmented_memory_posterior_ordinal_route.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_ordinal_ridge_static
  - ascal_gmm_segmented_memory_posterior_ordinal_ridge

method_configs:
  ascal_gmm_segmented_memory_posterior_ordinal_ridge_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_ordinal_ridge
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_ordinal_ridge:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_ordinal_ridge_r15
      research_name: ASCAL-JMP-OrdinalRidge
      research_version: R15
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      protected_base: exact_r12_ordinal_route
      protected_routing: exact_r12_unique_live_mdl_assignment
      protected_hard_decision: exact_r12_expert_boundary_decision
      protected_adaptation: exact_r12_segmentation_memory_and_expert_assignment
      accuracy_invariance: final_half_interval_readout_preserves_every_r12_hard_decision
      expert_type: r12_gmm_boundary_plus_one_online_weighted_ridge_ranker
      linear_head_per_expert: true
      residual_input: source_head_orthogonal_l2_normalized_frozen_features
      residual_teacher: prediction_time_selected_r12_gmm_equal_prior_log_odds
      residual_target: gmm_teacher_logit_minus_immutable_source_logit
      residual_target_centering: reliability_weighted_current_batch_mean
      reliability_rule: absolute_centered_soft_posterior_without_threshold
      ridge_objective: weighted_centered_logit_residual_error_plus_unit_l2_weight_norm
      ridge_prior: fixed_identity_under_unit_normalized_features
      ridge_update: exact_recursive_least_squares_woodbury_after_prediction
      optimizer: none
      learning_rate: none
      epochs: none
      residual_intercept: none
      prediction_residual_centering: subtract_current_batch_mean
      prediction_rule: r12_half_interval_with_source_logit_plus_centered_expert_ridge_rank
      routing_threshold: none
      prediction_mutates_experts: false
      batch_transductive_prediction: true
      raw_images_stored: false
      raw_features_stored: false
      new_target_hyperparameters: 0
      seed1_promotion_rule: exact_r12_accuracy_and_target_macro_online_auc_above_r06
