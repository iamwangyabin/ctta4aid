methods: [rotta]

method_configs:
  rotta:
    # Mirrors configs/adapter/rotta.yaml from the pinned official release.
    optimizer: Adam
    steps: 1
    beta: 0.9
    lr: 0.001
    wd: 0.0
    num_classes: 2
    nu: 0.001
    memory_size: 64
    update_frequency: 64
    lambda_t: 1.0
    lambda_u: 1.0
    alpha: 0.05
    image_size: 224
    gaussian_std: 0.005
    soft_augmentation: false
    # False preserves the official RobustBN path for CNN controlled runs.
    # The CLIP main experiment overrides this with an explicitly named
    # RoTTA-LN transfer while retaining the official online core.
    clip_visual_layernorm: false
    official_symbols:
      NU: 0.001
      MEMORY_SIZE: 64
      UPDATE_FREQUENCY: 64
      LAMBDA_T: 1.0
      LAMBDA_U: 1.0
      ALPHA: 0.05
    layernorm_transfer:
      result_label: RoTTA-LN
      retained: [CSTU, teacher_student_ema, entropy_objective, optimizer, update_frequency, online_order]
      unavailable: robust_bn_source_target_statistic_interpolation
    reference:
      profile: official_rotta_cifar_release_transferred_to_binary_aigc
      repository: https://github.com/BIT-DA/RoTTA
      commit: 67e34c900cdd355fc07e55edd4c577ea7b8ebcc9
      upstream_config: configs/adapter/rotta.yaml
      original_batch_size: 64
      original_input_size: 32
      original_num_classes: [10, 100]
      transfer_note: The CNN path retains all official constants. When clip_visual_layernorm is enabled, CSTU and online optimization constants remain fixed, while RobustBN alpha/statistic interpolation has no LayerNorm equivalent and is explicitly absent.
