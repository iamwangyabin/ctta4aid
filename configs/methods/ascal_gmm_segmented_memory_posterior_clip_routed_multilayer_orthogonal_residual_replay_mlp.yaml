extends: ascal_gmm_segmented_memory_posterior_clip_routed_orthogonal_residual_replay_mlp.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_clip_routed_multilayer_orthogonal_residual_replay_mlp_static
  - ascal_gmm_segmented_memory_posterior_clip_routed_multilayer_orthogonal_residual_replay_mlp

method_configs:
  ascal_gmm_segmented_memory_posterior_clip_routed_multilayer_orthogonal_residual_replay_mlp_static:
    adaptation_mode: static
    clip_feature_layers: [4, 8, 16, 24]
    reference:
      role: exact_single_view_non_adaptive_control_for_multilayer_orthogonal_residual
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_clip_routed_multilayer_orthogonal_residual_replay_mlp:
    adaptation_mode: full
    clip_feature_layers: [4, 8, 16, 24]
    feature_replay_hidden_dim: 64
    feature_replay_learning_rate: 0.001
    feature_replay_variance_floor: 0.000001
    feature_replay_samples_per_update: 256
    feature_replay_seed: 0
    reference:
      profile: ascal_jmp_multilayer_orthogonal_residual_r48
      research_name: ASCAL-JMP-MultiLayerOrthogonalResidual
      research_version: R48
      ablation_parent: ASCAL-JMP-OrthogonalResidual-R44
      ablation_variable: downstream_clip_feature_layers_24_to_4_8_16_24_concatenation
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      routing_score_used: false
      historical_expert_recall: clip_feature_route_only
      gmm_role: selected_expert_equal_prior_pseudo_label_and_continuous_reliability_only
      gmm_in_final_prediction: false
      clip_feature_layer_indexing: one_based_visual_transformer_blocks
      clip_feature_projection: each_selected_cls_through_frozen_visual_ln_post_and_proj
      downstream_feature_dim: 3072
      downstream_feature_consumers:
        - expert_routing
        - class_conditional_diagonal_gaussian_statistics
        - gaussian_replay
        - expert_residual_mlp
      source_score_feature_layer: 24
      source_score_rule: unchanged_r44_final_clip_feature_binary_head
      residual_head: one_zero_initialized_3072_to_64_to_1_gelu_mlp_per_expert
      residual_coordinate: blockwise_source_orthogonal_concatenated_clip_features
      source_coordinate_in_base_logit: true
      source_coordinate_in_residual_input: false
      training_objective: unchanged_r44_balanced_replay_bce
      prediction_rule: unchanged_r44_source_logit_plus_selected_expert_residual
      learning_rate: 0.001
      confidence_threshold: none
      fusion_weight: none
      target_selected_hyperparameters: 0
