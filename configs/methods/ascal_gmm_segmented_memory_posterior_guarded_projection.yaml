extends: ascal_gmm_segmented_memory_posterior_projection.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_guarded_projection_static
  - ascal_gmm_segmented_memory_posterior_guarded_projection

method_configs:
  ascal_gmm_segmented_memory_posterior_guarded_projection_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_guarded_projection
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_guarded_projection:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_guarded_scan_r03
      research_name: ASCAL-JMP-GuardedScan
      research_version: R03
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      adaptive_scope: unlabeled_density_guarded_complete_dyadic_mdl_segmentation
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_temperature
      partition_rule: largest_adjacent_component_mean_gap
      class_density_rule: independently_normalized_real_and_fake_gmm_blocks
      class_prior_rule: equal_real_and_fake_priors
      boundary_rule: cumulative_median_of_equal_density_boundaries
      segmentation_guard: deployed_boundary_outside_current_dominant_gap
      ordinary_scan_rule: existing_single_binary_scheduled_suffix
      guarded_scan_rule: every_dyadic_suffix_from_two_batches_to_half_the_segment
      change_evidence: existing_segmented_bic_and_stable_multimodal_suffix
      recall_rule: fixed_episode_deviance_plus_identity_code_vs_new_segment_bic
      recalled_boundary_rule: one_episode_boundary_vote_then_segment_median
      ranking_rule: source_margin_order_preserved_within_each_causal_state
      new_target_hyperparameters: 0
      raw_images_stored: false
      source_fallback: exact_when_bic_selects_one_component
