extends: ascal_gmm_segmented_memory_posterior_ordinal_route.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_analytic_expert_static
  - ascal_gmm_segmented_memory_posterior_analytic_expert

method_configs:
  ascal_gmm_segmented_memory_posterior_analytic_expert_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_analytic_expert
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_analytic_expert:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_analytic_expert_r18
      research_name: ASCAL-JMP-AnalyticExpert
      research_version: R18
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      protected_initialization: exact_r12_ordinal_route_probability
      protected_routing: exact_r12_unique_live_mdl_assignment
      protected_adaptation: exact_r12_segmentation_memory_and_expert_assignment
      accuracy_invariance: exact_r12_until_the_selected_expert_has_past_soft_supervision
      expert_scope: one_online_analytic_ridge_state_per_r12_gmm_expert
      expert_input: r12_signed_probability_anchor_plus_source_head_orthogonal_l2_normalized_frozen_features_plus_bias
      expert_decomposition: learned_anchor_scale_plus_feature_ranking_evidence_plus_expert_bias
      soft_teacher: selected_equal_prior_gmm_posterior_projected_onto_r12_routed_class_side
      soft_target: two_times_projected_posterior_minus_one
      reliability: absolute_signed_projected_posterior_without_threshold
      posterior_conflict_rule: contradictory_gmm_side_projects_to_half_and_zero_weight
      ridge_objective: reliability_weighted_bounded_soft_class_error_plus_squared_distance_from_r12_anchor_prior
      ridge_prior_mean: unit_r12_anchor_scale_zero_feature_weights_and_zero_bias
      ridge_prior: fixed_identity_for_bounded_or_l2_normalized_coordinates
      ridge_update: exact_recursive_least_squares_woodbury_after_prediction
      optimizer: none
      learning_rate: none
      epochs: none
      prediction_rule: half_of_one_plus_selected_old_expert_signed_score_with_probability_clipping
      routing_score_coordinate: immutable_source_score
      gmm_update_score_coordinate: immutable_source_score
      routing_threshold: none
      prediction_mutates_experts: false
      raw_images_stored: false
      raw_features_stored: false
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_above_r12_and_target_macro_online_auc_above_r06
