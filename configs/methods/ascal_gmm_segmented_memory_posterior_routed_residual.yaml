extends: ascal_gmm_segmented_memory_posterior_mixture_residual.yaml

methods:
  - ascal_gmm_segmented_memory_posterior_routed_residual_static
  - ascal_gmm_segmented_memory_posterior_routed_residual

method_configs:
  ascal_gmm_segmented_memory_posterior_routed_residual_static:
    adaptation_mode: static
    reference:
      role: exact_single_view_non_adaptive_control_for_routed_residual
      source_setup: lora_r4_binary_detector_from_fixed_clip_vitl14_with_score_anchors
      protocol: predict_then_adapt

  ascal_gmm_segmented_memory_posterior_routed_residual:
    adaptation_mode: full
    reference:
      profile: ascal_jmp_routed_residual_r13
      research_name: ASCAL-JMP-RoutedResidual
      research_version: R13
      protocol: predict_then_adapt
      target_labels_used: false
      generator_boundaries_used: false
      semantic_features_used: false
      frozen_scope: clip_backbone_lora_branches_binary_head_and_source_score
      immutable_history_coordinate: frozen_source_logit_margin_only
      base_prediction_rule: exact_r01_median_stabilized_posterior_projection
      score_boundary_routing: false
      residual_routing_coordinate: current_batch_immutable_frozen_source_logit_margin
      residual_routing_candidates: active_live_gmm_plus_archived_non_active_gmms
      active_snapshot_rule: hidden_when_the_same_expert_has_an_eligible_live_gmm
      residual_routing_proposal: minimum_negative_two_sum_log_fixed_gmm_predictive_density
      residual_routing_admission: non_active_memory_deviance_plus_uniform_identity_code_vs_current_batch_gmm_bic
      routing_threshold: none
      residual_assignment_consistency: same_selected_expert_reads_and_receives_the_batch
      expert_type: compact_real_plus_bic_fake_feature_prototype_state
      expert_network_count: 0
      residual_input: source_head_orthogonal_l2_normalized_frozen_features
      residual_teacher: equal_prior_prediction_time_selected_source_score_gmm_posterior
      reliability_rule: absolute_centered_soft_posterior_without_threshold
      real_prototype_rule: one_soft_prototype_per_score_expert
      fake_prototype_rule: one_soft_prototype_per_ordered_bic_selected_fake_component
      fake_component_count_rule: target_bic_with_existing_source_complexity_cap
      residual_update: selected_expert_closed_form_sufficient_statistics_after_prediction
      residual_readout: maximum_fake_component_cosine_minus_real_prototype_cosine
      prediction_rule: r01_continuous_base_logit_plus_selected_expert_residual
      routing_changes_score_calibrator: false
      prediction_mutates_experts: false
      batch_transductive_prediction: true
      optimizer: none
      new_target_hyperparameters: 0
      seed1_promotion_rule: accuracy_within_0p2pp_of_r11_and_auc_above_r06
      raw_images_stored: false
      raw_features_stored: false
