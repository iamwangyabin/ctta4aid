extends: iapl_official_genimage.yaml
repo_path: ${IAPL_REPO_PATH}
dataset_path: ${IAPL_GENIMAGE_ROOT}
pretrained_model: ${IAPL_GENIMAGE_CHECKPOINT}
clip_path: ${CLIP_VIT_L14_CHECKPOINT}
output_dir: outputs/iapl_official/caidbench_genimage_1gpu
nproc_per_node: 1

runtime_deviations:
  - Official shell uses eight local processes; available servers provide one GPU each,
    so evaluation uses one DDP process without changing model or TTA hyperparameters.
  - CAIDBench Arrow payloads are exported byte-for-byte into the official GenImage
    ImageFolder names; the manifest records every source sample and SHA-256.
