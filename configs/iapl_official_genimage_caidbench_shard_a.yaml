extends: iapl_official_genimage_caidbench_1gpu.yaml
test_selected_subsets: [ADM, BigGAN, glide, Midjourney]
output_dir: outputs/iapl_official/caidbench_genimage_shard_a
reference_metrics: null
require_reference_match: false

runtime_deviations:
  - Official shell uses eight local processes; this shard uses one DDP process.
  - Domains are split across two independent servers. IAPL resets parameters for every
    image, so domain sharding does not change the adaptation state seen by any sample.
  - CAIDBench Arrow payloads are exported byte-for-byte into official ImageFolder names.
