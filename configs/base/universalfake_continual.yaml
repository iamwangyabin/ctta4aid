seed: 0
device: auto
output_dir: outputs/universalfake/continual

protocol:
  name: predict_then_adapt
  reset_between_domains: false
  source_free_during_test: true
  target_labels_available_to_method: false
  generator_id_available_to_method: false
  passes: 1
  updates_per_batch: 1

model:
  architecture: resnet50
  pretrained: false
  num_classes: 2
  checkpoint: ${UFD_SOURCE_CHECKPOINT}

data:
  format: universalfake
  root: ${UFD_TEST_ROOT}
  image_size: 224
  batch_size: 16
  num_workers: 4
  shuffle: true
  max_samples_per_class: 750
  final_eval_max_samples_per_class: 250
  # Fixed GAN-to-diffusion sequence; ProGAN is the source.
  stream:
    - biggan
    - cyclegan
    - stylegan
    - gaugan
    - guided
    - glide_100_27
    - ldm_200
    - dalle

evaluation:
  threshold: 0.5
  curve_window_batches: 20
