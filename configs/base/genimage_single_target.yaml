seed: 0
device: auto
output_dir: outputs/genimage/single_target

protocol:
  name: predict_then_adapt
  source_free_during_test: true
  target_labels_available_to_method: false
  generator_id_available_to_method: false
  passes: 1
  updates_per_batch: 1

model:
  architecture: resnet50
  pretrained: false
  num_classes: 2
  checkpoint: ${GENIMAGE_SOURCE_CHECKPOINT}

data:
  format: genimage
  root: ${GENIMAGE_ROOT}
  split: val
  image_size: 224
  batch_size: 16
  num_workers: 4
  shuffle: true
  max_samples_per_class: 1000
  # SD V1.4 is the source generator and is deliberately excluded.
  targets:
    - Midjourney
    - Stable Diffusion V1.5
    - ADM
    - GLIDE
    - Wukong
    - VQDM
    - BigGAN

evaluation:
  threshold: 0.5
  curve_window_batches: 20
