ost:
  repository: https://github.com/liangchen527/OST.git
  commit: 1e4518b9e560baf9c5693f13a402fa5d7104190f
  upstream_files:
    - trainer/meta_xception.py
    - trainer/inner_loop_optimizers.py
    - trainer/whole_model.py
    - utils/am_softmax.py
  upstream_config: [README.md, train.py, utils/parser_params.py]
  checkpoint_url: https://drive.google.com/file/d/1A2EHgj7EW2RsfiqvtbnQSIvLkbVgDFlZ/view
  checkpoint_filename: xception_meta.pth
  checkpoint_size_bytes: 83476109
  project_profile: configs/methods/ost.yaml
  experiment_profiles: [configs/experiments/ost/genimage.yaml, configs/experiments/ost/ufd.yaml]
  official_core: src/official/ost
  model_loader: src/models/ost.py
  wrapper: src/methods/ost.py
  status: patched_vendored_official_core_with_cross_task_data_adapter
  source_distribution: vendored_at_explicit_user_direction
  upstream_license: none_declared
  local_changes:
    - provenance headers added to vendored Python files
    - line endings and trailing whitespace normalized without changing code semantics
    - AM-Softmax uint8 conditions changed to bool for current PyTorch
    - single-device inference core extracted from trainer/whole_model.py
    - single-device meta-training core extracted from Model.optimize in trainer/whole_model.py
    - official support/query second-order objective consumes canonical Arrow episodes
    - released SimSwap and landmark synthesis replaced by disclosed full-frame alpha blending
    - labeled source templates are read from the canonical Arrow source split
  training_entrypoints: [configs/train/ost_ufd_meta.yaml, configs/train/ost_genimage_meta.yaml]
  numerical_validation: not_equivalent_to_official_face_benchmark

