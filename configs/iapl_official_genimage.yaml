repo_path: external/IAPL
dataset: GenImage
dataset_path: ${IAPL_GENIMAGE_ROOT}
train_selected_subsets: [SDv14]
test_selected_subsets:
  - ADM
  - BigGAN
  - glide
  - Midjourney
  - stable_diffusion_v_1_4
  - stable_diffusion_v_1_5
  - VQDM
  - wukong

pretrained_model: ${IAPL_GENIMAGE_CHECKPOINT}
clip_path: ${CLIP_VIT_L14_CHECKPOINT}
output_dir: outputs/iapl_official/genimage
model_name: tta
epoch: 1
lr_drop: 10
gate: true
condition: true
tta: true
eval: true

# Names and values mirror the authors' tta_genimage.sh/main.py arguments.
nproc_per_node: 8
master_port: 29578
batchsize: 32
evalbatchsize: 32        # Used by official dataset code as total views.
lr: 0.005
tta_steps: 2
selection_p: 0.2        # int(32 * 0.2) = 6 selected confident views.
ois: true
smooth: true
num_workers: 8
seed: 100

protocol:
  name: official_iapl
  order: adapt_then_predict
  reset: per_image
  parameter_accumulation_between_images: false
  batchnorm_buffers_may_accumulate_between_images: true
  ddp_broadcast_buffers: true
  comparable_as_end_to_end_official_baseline: true
  comparable_to_controlled_predict_then_adapt_ablation: false

reference:
  repository: https://github.com/liyih/IAPL
  commit: a173e7783bbafaa00d60e6e31774a0bc14411a23
  upstream_script: tta_genimage.sh

# Authors' README: GenImage mACC=96.7%, mAP=99.5%.
reference_metrics: {acc: 0.967, ap: 0.995}
reference_tolerance: 0.01
require_reference_match: true
