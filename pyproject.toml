[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "online-aig-tta"
version = "0.1.0"
description = "Minimal online test-time adaptation framework for AI-generated image detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.18",
  "ftfy>=6.1",
  "numpy>=1.24",
  "packaging>=23.0",
  "pillow>=10.0",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "torchvision>=0.17",
  "regex>=2024.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
iapl = [
  "einops>=0.8",
  "einx>=0.3",
  "ftfy>=6.1",
  "matplotlib>=3.8",
  "opencv-python>=4.8",
  "pytorch-wavelets>=1.3",
  "pywavelets>=1.9",
  "regex>=2024.0",
  "scipy>=1.15",
  "timm>=1.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.official.iapl.clip" = ["*.gz"]
"src.official.openai_clip" = ["*.gz"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/official"]
