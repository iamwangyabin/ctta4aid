[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "online-aig-tta"
version = "0.1.0"
description = "Minimal online test-time adaptation framework for AI-generated image detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.18",
  "numpy>=1.24",
  "pillow>=10.0",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/online_aig_tta/official"]
